# KGK AI — CI/CD Pipeline
# Runs tests, linting, and builds on every push and PR.

name: KGK AI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # --- Linting ---
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install ruff black

      - name: Run ruff check
        run: ruff check app/ --output-format=github

      - name: Run black check
        run: black --check app/

  # --- Unit Tests (no GPU dependencies) ---
  test-core:
    name: Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run core tests
        run: |
          python -m pytest \
            tests/unit/test_config.py \
            tests/unit/test_logging.py \
            tests/unit/test_base_interfaces.py \
            tests/unit/test_chat_controller.py \
            tests/unit/test_ui.py \
            tests/unit/test_tools.py \
            tests/unit/test_memory.py \
            tests/unit/test_agents.py \
            tests/unit/test_api.py \
            -v --tb=short

  # --- Model Layer Tests (requires torch) ---
  test-model:
    name: Model Layer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run model tests
        run: python -m pytest tests/unit/test_model_layer.py -v --tb=short

  # --- RAG Tests (requires faiss) ---
  test-rag:
    name: RAG Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run RAG tests
        run: python -m pytest tests/unit/test_rag.py -v --tb=short

  # --- Docker Build ---
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test-core]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: kgk-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Deploy to Hugging Face (on main branch only) ---
  deploy-hf:
    name: Deploy to Hugging Face Space
    runs-on: ubuntu-latest
    needs: [lint, test-core, test-model, test-rag, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          git config --global user.email "ci@kgk.ai"
          git config --global user.name "KGK CI"
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO || true
          git push -f hf main || git push -f hf master
